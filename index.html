<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کلبه چای و قهوه سیمرغ</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f7f4ef; color: #2b2b2b; margin: 0; padding: 15px; direction: rtl; text-align: center; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        img.logo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #c86d12; margin-bottom: 10px; }
        h1 { color: #3d2314; font-size: 1.6rem; margin: 5px 0; }
        .tagline { color: #c86d12; font-size: 0.95rem; font-weight: bold; margin-bottom: 15px; }
        .categories-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }
        .cat-item { background-color: #fcf8f3; border: 1px solid #eedecc; border-radius: 8px; padding: 12px 4px; font-size: 0.78rem; color: #3d2314; font-weight: bold; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .cat-item:hover { background-color: #f2ede4; }
        .hours-container { background: #fcf8f3; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #c86d12; color: #3d2314; }
        .dropdown-container { margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #e2ded7; text-align: right; }
        .dropdown-toggle { width: 100%; background-color: #3d2314; color: #fff; padding: 12px 15px; font-size: 1rem; font-weight: bold; border: none; cursor: pointer; display: flex; justify-content: space-between; font-family: Tahoma, sans-serif; }
        .dropdown-content { display: none; background-color: #fcf8f3; padding: 10px; flex-direction: column; gap: 8px; }
        .dropdown-content.show { display: flex; }
        .sub-btn { display: block; color: #fff; text-decoration: none; padding: 10px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; text-align: center; }
        .btn-phone { background-color: #0284c7; }
        .btn-map { background-color: #10b981; }
        .btn-bale { background-color: #00779b; }
        .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743); }
        footer { margin-top: 20px; font-size: 0.85rem; color: #555; border-top: 1px solid #eee; padding-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://raw.githubusercontent.com/hoomamirs-ctrl/simorgh-blog/refs/heads/main/1760785858698.jpg" alt="لوگو" class="logo">
    <h1>کلبه چای و قهوه سیمرغ</h1>
    <div class="tagline">عطر اصیل قهوه تازه رست در تهرانپارس</div>

    <div class="categories-box">
        <a href="coffee.html" class="cat-item">☕ بار قهوه</a>
        <div class="cat-item">🍵 چای اصیل</div>
        <a href="souvenirs.html" class="cat-item">🍯 سوغاتی‌ها</a>
    </div>

    <div class="hours-container">
        🕒 ساعت کاری: شنبه تا پنجشنبه ۸ الی ۲۲ | جمعه‌ها ۸ الی ۱۳
    </div>

    <div class="dropdown-container">
        <button type="button" class="dropdown-toggle" onclick="toggleDropdown('contactMenu', this)">
            📞 تماس با ما و مسیریابی <span>▼</span>
        </button>
        <div id="contactMenu" class="dropdown-content">
            <a href="tel:02177341312" class="sub-btn btn-phone">📞 تلفن ثابت: ۷۷۳۴۱۳۱۲-۰۲۱</a>
            <a href="https://maps.app.goo.gl/uBgpYNVvRv8ejmto6" class="sub-btn btn-map" target="_blank">📍 مسیریابی در گوگل مپ</a>
        </div>
    </div>

    <div class="dropdown-container">
        <button type="button" class="dropdown-toggle" onclick="toggleDropdown('socialMenu', this)">
            🌐 شبکه‌های اجتماعی <span>▼</span>
        </button>
        <div id="socialMenu" class="dropdown-content">
            <a href="https://ble.ir/simorgh_coffee" class="sub-btn btn-bale" target="_blank">💬 بله سیمرغ</a>
            <a href="https://instagram.com/simorgh_coffee" class="sub-btn btn-ig" target="_blank">📷 اینستاگرام</a>
        </div>
    </div>

    <footer>
        📍 تهرانپارس، خیابان جشنواره، پلاک ۴۸
    </footer>
</div>

<script>
    function toggleDropdown(menuId, button) {
        const menu = document.getElementById(menuId);
        const isOpen = menu.classList.contains('show');
        document.querySelectorAll('.dropdown-content').forEach(item => item.classList.remove('show'));
        document.querySelectorAll('.dropdown-toggle span').forEach(item => item.textContent = '▼');
        if (!isOpen) {
            menu.classList.add('show');
            button.querySelector('span').textContent = '▲';
        }
    }
</script>

</body>
</html>
