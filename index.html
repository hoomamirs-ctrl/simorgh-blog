<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کلبه چای و قهوه سیمرغ | تهرانپارس</title>
<style>
*{box-sizing:border-box}
body{font-family:Tahoma,sans-serif;background:#f6f2ec;color:#25201c;margin:0;padding:16px 14px 100px;direction:rtl;text-align:center}
.box{max-width:560px;margin:10px auto;background:#fff;padding:22px 18px;border-radius:16px;border:1px solid #e8d8c3;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.logo{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #c86d12;margin-bottom:8px}
h1{color:#2d180d;font-size:1.45rem;margin:6px 0}
.sub{color:#b45d0b;font-weight:bold;font-size:.9rem;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.card{background:#fcf7f0;border:1px solid #e8d8c3;border-radius:10px;padding:10px 6px;font-size:.78rem;font-weight:bold;color:#3d2314;text-decoration:none}
.hours{background:#fcf7f0;border:1.5px dashed #b45d0b;border-radius:12px;padding:12px;margin-bottom:14px;font-size:.82rem}
.timer{margin-top:8px;font-weight:bold;color:#2d180d;background:#fff;padding:8px;border-radius:8px;border:1px solid #efe2d2}
.btn{display:block;width:100%;padding:11px;margin-bottom:8px;border-radius:10px;text-decoration:none;font-weight:bold;font-size:.85rem;color:#fff}
.b1{background:#00779b}.b2{background:#059669}.b3{background:#3d2314}
.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="box">
  <img src="https://raw.githubusercontent.com/hoomamirs-ctrl/simorgh-blog/refs/heads/main/1760785858698.jpg" alt="لوگو سیمرغ" class="logo">
  <h1>کلبه چای و قهوه سیمرغ</h1>
  <div class="sub">دانه قهوه تازه رست در تهرانپارس</div>

  <div class="grid">
    <a href="./coffee.html" class="card">☕ بار قهوه</a>
    <a href="./tea.html" class="card">🍵 چای و دمنوش</a>
    <a href="./souvenirs.html" class="card">🍯 سوغاتی‌ها</a>
  </div>

  <div class="hours">
    <div>🕒 شنبه تا پنجشنبه: ۰۸:۰۰ الی ۲۲:۰۰ | جمعه‌ها: ۰۸:۰۰ الی ۱۳:۰۰</div>
    <div id="tm" class="timer">در حال محاسبه...</div>
  </div>

  <a href="https://ble.ir/simorgh_coffee" class="btn b1" target="_blank" rel="noopener noreferrer">💬 پیام در بله</a>
  <a href="tel:02177341312" class="btn b2">📞 تماس با فروشگاه: ۷۷۳۴۱۳۱۲-۰۲۱</a>
  <a href="https://maps.app.goo.gl/uBgpYNVvRv8ejmto6" class="btn b3" target="_blank" rel="noopener noreferrer">📍 مسیریابی در گوگل مپ</a>

  <p style="font-size:.8rem;color:#575049;margin-top:12px">تهران، تهرانپارس، خیابان جشنواره، روبروی بهزیستی، پلاک ۴۸</p>
</div>

<script>
function p2(n){return n<10?'0'+n:''+n;}
function getIR(){
  var now=new Date();
  var utc=now.getTime()+(now.getTimezoneOffset()*60000);
  var ir=new Date(utc+(3.5*3600000));
  return{d:ir.getUTCDay(),h:ir.getUTCHours(),m:ir.getUTCMinutes(),s:ir.getUTCSeconds()};
}
function run(){
  var t=getIR(),sec=t.h*3600+t.m*60+t.s;
  var open=8*3600,close=((t.d===5)?13:22)*3600;
  var el=document.getElementById('tm');
  if(!el)return;
  var diff=(sec>=open&&sec<close)?(close-sec):((sec<open)?(open-sec):((86400-sec)+open));
  var label=(sec>=open&&sec<close)?'باز است - تا تعطیلی: ':'بسته است - تا بازگشایی: ';
  var h=Math.floor(diff/3600),m=Math.floor((diff%3600)/60),s=diff%60;
  el.innerHTML=label+'<span class="ltr">'+p2(h)+':'+p2(m)+':'+p2(s)+'</span>';
}
run();
setInterval(run,1000);
</script>
</body>
</html>
